<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Alok's blog — thoughts on systems, Go, web, and software engineering." />
  <title>~/blog — Alok</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="blog-page">
    <a href="index.html" class="blog-back" id="blog-back-btn">&#8592;</a>
    <h1 class="blog-page-title">~/blog</h1>

    <div id="blog-list">
      <p class="loading-msg">Loading posts…</p>
    </div>
  </div>

  <script>
    async function loadBlog() {
      const container = document.getElementById('blog-list');

      try {
        const res = await fetch('blog/index.json');
        if (!res.ok) throw new Error('index.json not found');
        const posts = await res.json();

        if (!posts.length) {
          container.innerHTML = '<p class="loading-msg">No posts yet.</p>';
          return;
        }

        container.innerHTML = posts.map(post => `
          <article class="blog-card" tabindex="0" onclick="location.href='post.html?slug=${encodeURIComponent(post.slug)}'">
            <p class="blog-card-title">${escHtml(post.title)}</p>
            <p class="blog-card-date">${escHtml(post.date)}</p>
            <p class="blog-card-summary">${escHtml(post.summary)}</p>
            <div class="tags">
              ${post.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
            </div>
          </article>
        `).join('');

      } catch (err) {
        container.innerHTML = `
          <p class="loading-msg" style="color:var(--text-dim)">
            Could not load posts. Run <code style="color:var(--accent)">node build-blog.js</code> first.
          </p>`;
        console.error(err);
      }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadBlog();
  </script>
</body>

</html>
